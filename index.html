<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Офіційне посилання на гру</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #121212;
      color: #f4f4f4;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      min-height: 100vh;
      padding: 6vw;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #1d1d1d;
    }
    p { line-height: 1.35; }
    .note { color: #bdbdbd; font-size: clamp(1rem, 2vw, 1.75rem); font-weight: 600; }
    .official { margin-bottom: 0; font-size: clamp(2rem, 5.5vw, 5.5rem); font-weight: 900; }
    .official a { display: block; margin-top: 0.4em; color: #73b7ff; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="note">
      simfrontfan та simfront_war
      Сыны дырявых блядей спиздили силку на игру и выдают за свою игру<br>даже не надійся повернути контроль над &quot;твоєю&quot; грою
    </p>
    <p class="official">
      Офіційне посилання на гру
      <a href="https://t.me/simfrontcomander" target="_blank" rel="noopener noreferrer">https://t.me/simfrontcomander</a>
    </p>
  </main>
</body>
</html>
